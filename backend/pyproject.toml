[project]
name = "firerosetta"
version = "0.1.0"
description = "MODIS + VIIRS hotspot harmonization pipeline and API"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyproj>=3.7",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false
